# ============================================================================
# dados_candidatura — padrão único de dados do candidato
# ----------------------------------------------------------------------------
# Chaves em INGLÊS, conforme src/auto_job_apply/schema.py.
# Preencha apenas o que tiver; campos ausentes são ignorados pelos sites.
# Para ver o que falta para um site: `make check-dados SITE=<nome>`.
# Valores abaixo são FICTÍCIOS (exemplo) — não usar em candidaturas reais.
# ============================================================================

# ---- personal --------------------------------------------------------------
full_name: "Candidata Exemplo"        # obrigatório: nome e sobrenome
first_name: "Candidata"
last_name: "Exemplo"
birth_date: "15/03/1990"              # dd/mm/aaaa
gender: "female"                      # male | female | other | prefer_not_to_say
pronouns: ""                          # ex.: she/her, he/him, they/them
cpf: "111.444.777-35"                 # BR (máscaras são ignoradas)
nationality: "Brasileira"
marital_status: ""                    # single | married | divorced | widowed
has_disability: false                 # true | false
disabilities: []                      # hearing | vision | intellectual | physical | other
photo_path: ""                        # caminho local da foto (jpg/png)

# ---- contact ---------------------------------------------------------------
email: "candidata.exemplo@gmail.com"
phone: "(21) 95555-5555"              # DDI opcional; máscaras são ignoradas
phone_country_code: "+55"
alternative_phone: ""
linkedin_url: "https://linkedin.com/in/candidata-exemplo"
github_url: ""
portfolio_url: ""
website_url: ""

# ---- address ---------------------------------------------------------------
country: "BR"                         # código ISO 3166-1 alfa-2 (ex.: BR)
state: "SC"                           # UF/estado
city: "Sao Jose"                      # formato "Cidade - UF" também funciona
neighborhood: "Centro"
address: "Rua Casa das Árvores, 55"
address_line2: "Vila Formosa"         # complemento
zip_code: "88101-320"

# ---- professional ----------------------------------------------------------
headline: "Desenvolvedora de Software Sênior"   # cargo atual (título curto)
desired_role: "Desenvolvedora de Software"      # cargo pretendido
summary: "Engenheira de software com 8 anos de experiência em produtos digitais, com foco em automação e qualidade."
experience_years: 8
skills: ["Python", "FastAPI", "Playwright", "Vue.js"]
education_level: "bachelor"           # high_school | technical | associate | bachelor | master | phd
english_level: "advanced"             # basic | intermediate | advanced | fluent | native
other_languages: []
salary_expectation: 4500              # número (moeda em salary_currency)
salary_currency: "BRL"
contract_type: "CLT"                  # CLT | PJ | internship | trainee | temporary | other
work_model: "remote"                  # remote | hybrid | onsite (inhire converte p/ Sim/Não)
availability: "immediate"             # immediate | notice
notice_period_days: 0
willing_to_relocate: false
has_driver_license: false
driver_license_categories: ""
has_vehicle: false

# ---- diversity (usado por alguns sites, ex.: inhire) -----------------------
gender_identity: "prefer_not_to_say"  # male | female | non_binary | prefer_not_to_say
sexual_orientation: "prefer_not_to_say"  # heterosexual | homosexual | bisexual | other | prefer_not_to_say
race_ethnicity: "prefer_not_to_say"   # white | black | brown | asian | indigenous | other | prefer_not_to_say
disability_identity: "no"             # yes | no | prefer_not_to_say

# ---- application (desta candidatura) ---------------------------------------
referral: ""                          # nome de quem indicou (vazio = sem indicação)
how_did_you_hear: "Indeed"            # Indeed | LinkedIn | indicação | ...
cover_letter: ""                      # carta de apresentação (texto)
consent: true                         # autoriza processamento dos dados (LGPD)
resume_path: "assets/curriculo.pdf"   # usado quando --curriculo não é passado
additional_documents: []
