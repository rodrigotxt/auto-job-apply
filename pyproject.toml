[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-job-apply"
version = "0.1.0"
description = "Biblioteca para automação de candidaturas"
dependencies = [
    "playwright",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]

select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# F401: imports de sites são propositais (efeito colateral: registrar no SITES_REGISTRY)
"src/auto_job_apply/__init__.py" = ["F401"]
# BLE001: nos sites, campos são opcionais — exceção genérica evita quebrar o fluxo
"src/auto_job_apply/sites/*.py" = ["BLE001"]
